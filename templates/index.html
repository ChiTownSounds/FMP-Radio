<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FMP Ultimate: Control Room</title>
    <style>
        body { background: #0a0a0a; color: #eee; font-family: 'Segoe UI', sans-serif; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 900px; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 15px; }
        .card { background: #161616; padding: 15px; border-radius: 8px; border: 1px solid #222; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .card h3 { margin: 0 0 5px 0; color: #555; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .card p { font-size: 20px; margin: 0; font-weight: bold; color: #00ff41; }
        .url-input { width: 100%; height: 100px; background: #000; color: #00ff41; border: 1px solid #333; border-radius: 5px; padding: 10px; box-sizing: border-box; font-family: monospace; }
        .log-box { background: #000; color: #aaa; font-family: 'Consolas', monospace; padding: 15px; height: 250px; overflow-y: auto; border: 1px solid #333; font-size: 12px; line-height: 1.5; margin-top: 15px; }
        .log-success { color: #00ff41; font-weight: bold; }
        .log-fail { color: #ff3e3e; }
        .log-info { color: #00e5ff; }
        .lyrics-badge { background: #00ff41; color: #000; font-weight: bold; font-size: 10px; padding: 2px 6px; border-radius: 3px; margin-left: 5px; }
        button { cursor: pointer; border: none; border-radius: 4px; font-weight: bold; padding: 10px; transition: 0.3s; }
        .btn-green { background: #1b5e20; color: white; border: 1px solid #2e7d32; }
        .btn-green:hover { background: #2e7d32; box-shadow: 0 0 10px #2e7d32; }
        .btn-blue { background: #01579b; color: white; border: 1px solid #0277bd; }
        .btn-blue:hover { background: #0277bd; box-shadow: 0 0 10px #0277bd; }
        .btn-red { background: #b71c1c; color: white; }
        .btn-red:hover { background: #d32f2f; box-shadow: 0 0 10px #d32f2f; }
        .btn-small-red { background: #b71c1c; color: white; padding: 5px 10px; font-size: 11px; }
        .results-scroll { max-height: 500px; overflow-y: auto; background: #000; border: 1px solid #333; margin-top: 10px; border-radius: 4px; }
        .match-row { display: flex; flex-direction: column; padding: 12px; border-bottom: 1px solid #111; gap: 6px; }
        .match-row:hover { background: #111; }
        .match-header { display: flex; justify-content: space-between; align-items: center; }
        .match-title { font-size: 14px; font-weight: bold; color: #fff; }
        .match-meta { font-size: 11px; color: #888; display: flex; gap: 12px; align-items: center; }
        .meta-val { color: #00ff41; }
    </style>
</head>
<body>
<div class="container">
    <h1 style="text-align: center; color: #fff; font-weight: 100; letter-spacing: 5px;">FMP <span style="color: #ff3e3e;">ULTIMATE</span></h1>
    
    <div class="grid">
        <div class="card"><h3>Engine</h3><p id="status-text">Idle</p></div>
        <div class="card"><h3>Queue</h3><p id="queue-count">0</p></div>
        <div class="card"><h3>Vaulted</h3><p id="completed-count">0</p></div>
        <div class="card"><h3>Current Era</h3><p id="target-year">---</p></div>
    </div>

    <div class="card">
        <h3>Routing & Input Pipeline</h3>
        <div style="display: flex; gap: 10px; margin-bottom: 10px; align-items: center;">
            <select id="target-show" style="flex: 2; padding: 10px; background: #000; color: #fff; border: 1px solid #333; font-weight: bold;">
                <option value="">▶ ROUTE TO MAIN CATALOG (AUTO-SORT ERAS)</option>
            </select>
            <button class="btn-blue" style="flex: 1;" onclick="createShow()">+ NEW SHOW</button>
        </div>
        
        <textarea id="url-input" class="url-input" placeholder="Drop YouTube URLs here..."></textarea>
        
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button class="btn-green" style="flex: 2;" onclick="addUrls()">INGEST URLs</button>
            
            <input type="file" id="local-file" accept=".mp3,.wav,.m4a" style="display: none;" onchange="handleLocalUpload()">
            <button class="btn-blue" style="flex: 2;" onclick="document.getElementById('local-file').click()">UPLOAD LOCAL MP3</button>
            
            <button class="btn-red" style="flex: 1;" onclick="stopProcess()">STOP ENGINE</button>
        </div>
    </div>

    <div class="card" style="border-top: 2px solid #ff3e3e; margin-top: 15px;">
        <h3 style="color: #ff3e3e;">The Eraser</h3>
        <div style="display: flex; gap: 5px;">
            <input type="text" id="scrub-q" style="flex:1; background:#000; color:#fff; border:1px solid #333; padding:10px;" placeholder="Search Master Library..." onkeydown="if(event.key==='Enter') search()">
            <button style="background:#333; color:#fff;" onclick="search()">SEARCH</button>
        </div>
        <div id="results" class="results-scroll" style="display:none;"></div>
    </div>

    <div class="log-box" id="log-box"></div>
</div>

<script>
    async function loadShows() {
        try {
            const res = await fetch('/api/shows');
            const shows = await res.json();
            const sel = document.getElementById('target-show');
            sel.innerHTML = '<option value="">▶ ROUTE TO MAIN CATALOG (AUTO-SORT ERAS)</option>';
            shows.forEach(s => {
                sel.innerHTML += `<option value="Shows/${s}">SHOW: ${s}</option>`;
            });
        } catch(e) { console.error("Failed to load shows", e); }
    }

    window.onload = loadShows;

    setInterval(async () => {
        try {
            const r = await fetch('/api/status'); const d = await r.json();
            document.getElementById('status-text').innerText = d.current_status;
            document.getElementById('queue-count').innerText = d.total_in_queue;
            document.getElementById('completed-count').innerText = d.completed_count;
            
            const logBox = document.getElementById('log-box'); 
            logBox.innerHTML = d.logs.map(l => {
                let cls = '';
                if(l.includes('Complete') || l.includes('ERASED')) cls = 'log-success';
                if(l.includes('failed') || l.includes('Rejected')) cls = 'log-fail';
                if(l.includes('Phase') || l.includes('PREP') || l.includes('PURGE') || l.includes('OVERWRITE')) cls = 'log-info';
                return `<div class="${cls}">> ${l}</div>`;
            }).join('');
            logBox.scrollTop = 9999;

            if(d.logs.length > 0) {
                const last = d.logs[d.logs.length-1];
                const match = last.match(/\d{4}/);
                if(match) document.getElementById('target-year').innerText = match[0];
            }
        } catch(e) {}
    }, 1000);

    async function createShow() {
        const name = prompt("Enter new show name (e.g., DBMorning, ChiBridge):");
        if(!name) return;
        await fetch('/api/new_show', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({show_name: name}) });
        loadShows();
    }

    async function addUrls() {
        const val = document.getElementById('url-input').value;
        const target = document.getElementById('target-show').value;
        if(!val.trim()) return;
        await fetch('/add', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({urls: val, target: target}) });
        document.getElementById('url-input').value = '';
    }

    async function handleLocalUpload() {
        const fileInput = document.getElementById('local-file');
        const target = document.getElementById('target-show').value;
        if(fileInput.files.length === 0) return;
        
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        formData.append('target', target);
        
        await fetch('/upload_local', { method: 'POST', body: formData });
        fileInput.value = ''; // clear input
    }

    async function stopProcess() { await fetch('/stop', { method: 'POST' }); }

    async function search() {
        const q = document.getElementById('scrub-q').value;
        const div = document.getElementById('results');
        
        if(!q.trim()) { div.innerHTML = ''; div.style.display = 'none'; return; }
        
        try {
            const res = await fetch('/search_scrub', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({query: q}) });
            const list = await res.json();
            
            div.style.display = 'block';
            div.innerHTML = list.length ? '' : '<div style="padding:10px; color: #888;">No results found.</div>';
            
            list.forEach(item => {
                const hasLyrics = item['Lyrics'] === 'True';
                const lyricsBadge = hasLyrics ? '<span class="lyrics-badge">LYRICS</span>' : '';
                const year = item['Year'] || 'Unknown';
                const length = item['Length'] || '--:--';
                const bitrate = item['Bitrate'] || '320';

                div.innerHTML += `
                <div class="match-row">
                    <div class="match-header">
                        <span class="match-title">${item.name}</span>
                        <button class="btn-small-red" onclick="scrub('${item.name.replace(/'/g, "\\'")}')">SCRUB</button>
                    </div>
                    <div class="match-meta">
                        <span>Year: <span class="meta-val">${year}</span></span>
                        <span>Length: <span class="meta-val">${length}</span></span>
                        <span>Bitrate: <span class="meta-val">${bitrate}k</span></span>
                        <span>Match: <span class="meta-val">${item.score}%</span></span>
                        ${lyricsBadge}
                    </div>
                </div>`;
            });
        } catch(e) { console.error("Search failed on the frontend:", e); }
    }

    async function scrub(name) {
        if(!confirm(`Delete ${name}?`)) return;
        await fetch('/execute_scrub', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({track_name: name}) });
        search();
    }
</script>
</body>
</html>
